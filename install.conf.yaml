- defaults:
    link:
      relink: true

- clean: ["~"]

# Gitignored, so missing on a fresh clone; seed it before the link below.
- shell:
    - command: '[ -f zsh/zshenv.local ] || echo "# Per-machine values only (secrets, host-only paths). Untracked by design." > zsh/zshenv.local'

- link:
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv
    ~/.zshenv.local: zsh/zshenv.local
    ~/.zprofile: zsh/zprofile
    ~/.gitconfig:
    ~/.vimrc:
    ~/.config/starship.toml:
      create: true
    ~/.config/nvim:
      create: true
    ~/.config/bat:
      create: true
    ~/.config/glide:
      create: true
    ~/.config/zed/settings.json:
      path: zed/settings.json
      create: true
    ~/.config/zed/keymap.json:
      path: zed/keymap.json
      create: true
    ~/.config/helix:
      create: true
    ~/.config/coc:
      path: nvim/coc
      create: true

- create:
    - ~/Code
    - ~/Code/Testbed
    - ~/Screenshots

- shell:
    - command: ./setup_homebrew.zsh
      stdout: true
      stderr: true
    - command: ./setup_macos.zsh
      stdout: true
      stderr: true
    - command: ./setup_zsh.zsh
      stdout: true
      stderr: true
